spring.application.name=studynote

# --- Dev DB: file-based H2 (data persists under ./data) ---
# MariaDB로 전환할 때는 아래 4줄을 주석 처리하고
# spring.datasource.url=jdbc:mariadb://localhost:3306/studynote?useUnicode=true&characterEncoding=utf8
# spring.datasource.username=root
# spring.datasource.password=changeme
# spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:h2:file:./data/studynote;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
