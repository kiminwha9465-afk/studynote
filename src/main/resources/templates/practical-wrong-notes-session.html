<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('실기 시험 상세')}"></head>
<body class="min-h-screen bg-slate-50 dark:bg-zinc-900">
<div th:replace="~{fragments/common :: nav('practical-wrong-notes')}"></div>

<main class="mx-auto max-w-3xl px-4 py-8">

    <!-- 뒤로가기 + 삭제 -->
    <div class="mb-4 flex items-center justify-between">
        <a th:href="@{/practical/wrong-notes}"
           class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-slate-700 dark:text-zinc-400 dark:hover:text-zinc-200">
            ← 목록으로
        </a>
        <form th:action="@{/practical/wrong-notes/session/{key}/delete(key=${wrongSess.sessionKey()})}" method="post"
              onsubmit="return confirm('이 시험 기록을 삭제할까요?')">
            <button type="submit"
                    class="rounded-md border border-red-300 px-3 py-1 text-xs font-medium text-red-500 hover:bg-red-50 dark:border-red-700 dark:text-red-400 dark:hover:bg-red-900/20">
                기록 삭제
            </button>
        </form>
    </div>

    <!-- 시험 제목 + 요약 -->
    <div class="mb-6 rounded-lg border bg-white p-5 shadow-sm dark:bg-zinc-800 dark:border-zinc-700">
        <h1 class="text-lg font-bold text-slate-800 dark:text-zinc-100" th:text="${wrongSess.title()}"></h1>
        <p class="mt-1 text-xs text-slate-400 dark:text-zinc-500"
           th:text="${#temporals.format(wrongSess.solvedAt(), 'yyyy년 MM월 dd일 HH:mm')}"></p>
        <div class="mt-3 flex items-center gap-4">
            <span class="text-sm font-bold"
                  th:classappend="${wrongSess.scorePercent() >= 60} ? 'text-indigo-600 dark:text-indigo-400' : 'text-red-500 dark:text-red-400'"
                  th:text="${wrongSess.scorePercent()} + '점'"></span>
            <div class="flex gap-4 text-sm text-slate-600 dark:text-zinc-300">
                <span>총 <strong th:text="${wrongSess.totalCount()}"></strong>문제</span>
                <span class="font-semibold text-green-700 dark:text-green-400">정답 <span th:text="${wrongSess.correctCount()}"></span>개</span>
                <span class="font-semibold text-red-600 dark:text-red-400">오답 <span th:text="${wrongSess.wrongRecords().size()}"></span>개</span>
            </div>
        </div>
    </div>

    <!-- 오답 목록 -->
    <h2 class="mb-3 flex items-center gap-2 text-base font-bold text-slate-700 dark:text-zinc-200">
        <span class="rounded-full bg-red-100 px-2.5 py-0.5 text-sm text-red-600 dark:bg-red-900/40 dark:text-red-400">오답</span>
        <span th:text="${wrongSess.wrongRecords().size()} + '개'"></span>
    </h2>

    <div th:if="${#lists.isEmpty(wrongSess.wrongRecords())}"
         class="rounded-lg border border-dashed p-8 text-center text-slate-400 dark:border-zinc-600 dark:text-zinc-500">
        <p class="text-base font-medium">남은 오답이 없습니다.</p>
    </div>

    <div class="flex flex-col gap-5">
        <div th:each="record : ${wrongSess.wrongRecords()}"
             class="rounded-lg border bg-white p-5 shadow-sm dark:bg-zinc-800 dark:border-zinc-700">
            <!-- 문제 출처 -->
            <p class="mb-2 text-xs text-slate-400 dark:text-zinc-500"
               th:text="${record.question.examYear} + '년 ' + ${record.question.examRound} + '회 ' + ${record.question.questionNo} + '번'"></p>

            <!-- 문제 내용 -->
            <div class="mb-3 text-sm text-slate-800 dark:text-zinc-100 leading-relaxed"
                 th:utext="${record.question.contentHtml}"></div>

            <!-- 제출 / 정답 -->
            <div class="grid grid-cols-2 gap-3 text-sm mb-3">
                <div class="rounded-md bg-red-50 px-3 py-2 dark:bg-red-900/20">
                    <p class="mb-0.5 text-xs font-semibold text-red-400">내 답안</p>
                    <p th:if="${!#strings.isEmpty(record.submitted)}"
                       class="font-semibold text-red-700 dark:text-red-300"
                       th:text="${record.submitted}"></p>
                    <p th:if="${#strings.isEmpty(record.submitted)}"
                       class="text-slate-400 italic">미응답</p>
                </div>
                <div class="rounded-md bg-green-50 px-3 py-2 dark:bg-green-900/20">
                    <p class="mb-0.5 text-xs font-semibold text-green-600 dark:text-green-400">정답</p>
                    <p class="font-semibold text-green-700 dark:text-green-300"
                       th:text="${#strings.replace(record.question.answer, '|', ' / ')}"></p>
                </div>
            </div>

            <!-- 해설 -->
            <div th:if="${record.question.explanation != null}" class="mb-3">
                <button type="button"
                        onclick="this.nextElementSibling.classList.toggle('hidden')"
                        class="text-xs font-semibold text-indigo-600 hover:underline dark:text-indigo-400">
                    해설 보기 ▾
                </button>
                <div class="hidden mt-2 rounded-md bg-indigo-50 px-3 py-2 text-xs text-slate-700 leading-relaxed dark:bg-indigo-900/20 dark:text-zinc-300"
                     th:text="${record.question.explanation}"></div>
            </div>

            <!-- 메모 -->
            <details class="mt-2">
                <summary class="cursor-pointer text-xs font-semibold text-slate-500 hover:text-slate-700 dark:text-zinc-400 dark:hover:text-zinc-200">
                    메모
                    <span th:if="${record.memo != null and !#strings.isEmpty(record.memo)}"
                          class="ml-1 text-indigo-500">●</span>
                </summary>
                <form method="post" th:action="@{/practical/wrong-notes/{id}/memo(id=${record.id})}"
                      class="mt-2 flex gap-2">
                    <input type="hidden" name="sessionKey" th:value="${wrongSess.sessionKey()}">
                    <input type="text" name="memo" th:value="${record.memo}"
                           placeholder="메모를 입력하세요"
                           class="flex-1 rounded-md border border-slate-300 px-2 py-1 text-sm dark:bg-zinc-700 dark:border-zinc-600 dark:text-zinc-200">
                    <button type="submit"
                            class="rounded-md bg-slate-200 px-3 py-1 text-xs font-semibold text-slate-700 hover:bg-slate-300 dark:bg-zinc-700 dark:text-zinc-300 dark:hover:bg-zinc-600">
                        저장
                    </button>
                </form>
            </details>

            <!-- 정답 처리 -->
            <form method="post" th:action="@{/practical/wrong-notes/{id}/mark-correct(id=${record.id})}"
                  class="mt-3"
                  onsubmit="return confirm('이 문제를 정답으로 처리할까요?')">
                <input type="hidden" name="sessionKey" th:value="${wrongSess.sessionKey()}">
                <button type="submit"
                        class="text-xs text-green-600 hover:text-green-700 dark:text-green-400 dark:hover:text-green-300">
                    정답 처리
                </button>
            </form>
        </div>
    </div>

    <!-- ===== 여기서부터는 맞힌 문제 ===== -->
    <div th:if="${!#lists.isEmpty(wrongSess.correctRecords())}" class="mt-10">
        <div class="mb-3 flex items-center gap-2">
            <div class="h-px flex-1 bg-slate-200 dark:bg-zinc-700"></div>
            <h2 class="flex items-center gap-2 text-base font-bold text-slate-700 dark:text-zinc-200">
                <span class="rounded-full bg-green-100 px-2.5 py-0.5 text-sm text-green-700 dark:bg-green-900/40 dark:text-green-400">정답</span>
                <span>여기서부터는 맞힌 문제입니다</span>
                <span th:text="'(' + ${wrongSess.correctRecords().size()} + '개)'"></span>
            </h2>
            <div class="h-px flex-1 bg-slate-200 dark:bg-zinc-700"></div>
        </div>

        <div class="flex flex-col gap-5">
            <div th:each="record : ${wrongSess.correctRecords()}"
                 class="rounded-lg border bg-white p-5 shadow-sm opacity-80 dark:bg-zinc-800 dark:border-zinc-700">
                <!-- 문제 출처 -->
                <p class="mb-2 text-xs text-slate-400 dark:text-zinc-500"
                   th:text="${record.question.examYear} + '년 ' + ${record.question.examRound} + '회 ' + ${record.question.questionNo} + '번'"></p>

                <!-- 문제 내용 -->
                <div class="mb-3 text-sm text-slate-800 dark:text-zinc-100 leading-relaxed"
                     th:utext="${record.question.contentHtml}"></div>

                <!-- 제출 / 정답 -->
                <div class="grid grid-cols-2 gap-3 text-sm">
                    <div class="rounded-md bg-green-50 px-3 py-2 dark:bg-green-900/20">
                        <p class="mb-0.5 text-xs font-semibold text-green-600 dark:text-green-400">내 답안</p>
                        <p class="font-semibold text-green-700 dark:text-green-300" th:text="${record.submitted}"></p>
                    </div>
                    <div class="rounded-md bg-slate-50 px-3 py-2 dark:bg-zinc-700/50">
                        <p class="mb-0.5 text-xs font-semibold text-slate-400 dark:text-zinc-500">정답</p>
                        <p class="font-semibold text-slate-800 dark:text-zinc-100"
                           th:text="${#strings.replace(record.question.answer, '|', ' / ')}"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
