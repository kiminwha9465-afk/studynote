<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('모의고사 결과')}"></head>
<body class="min-h-screen bg-slate-50">
<div th:replace="~{fragments/common :: nav('exam')}"></div>

<main class="mx-auto max-w-3xl px-4 py-8">
    <h1 class="mb-1 text-xl font-bold text-slate-800" th:text="${result.title}"></h1>

    <div class="mb-6 rounded-lg border bg-white p-5 shadow-sm">
        <p class="text-3xl font-bold text-indigo-600">
            <span th:text="${result.scorePercent()}"></span><span class="text-lg">점</span>
        </p>
        <p class="mt-1 text-sm text-slate-500">
            <span th:text="${result.correctCount()}"></span> / <span th:text="${result.totalCount()}"></span> 문제 정답
        </p>
    </div>

    <div class="flex flex-col gap-3">
        <div class="rounded-lg border bg-white p-4 shadow-sm" th:each="r, iter : ${result.results()}"
             th:classappend="${r.correct()} ? '' : 'border-red-200'">
            <div class="mb-1 flex items-center gap-2">
                <span class="text-xs font-semibold text-slate-400" th:text="${iter.count} + '.'"></span>
                <span class="rounded bg-indigo-50 px-2 py-0.5 text-xs font-semibold text-indigo-600" th:text="${r.question().subject.label}"></span>
                <span class="text-xs font-semibold" th:classappend="${r.correct()} ? 'text-green-600' : 'text-red-600'"
                      th:text="${r.correct()} ? '정답' : '오답'"></span>
            </div>
            <a th:href="@{/questions/{id}(id=${r.question().id})}"
               class="font-medium text-slate-800 hover:text-indigo-600" th:utext="${r.question().content}"></a>
            <p th:if="${!r.correct()}" class="mt-1 text-sm text-slate-600">
                내가 고른 답: <span class="font-semibold text-red-600" th:text="${r.selectedAnswer()}"></span>번
                / 정답: <span class="font-semibold text-green-600" th:text="${r.question().answerNo}"></span>번
            </p>
        </div>
    </div>

    <div class="mt-6 flex gap-4 text-sm">
        <a th:href="@{/exam}" class="font-medium text-indigo-600 hover:underline">모의고사 다시 시작</a>
        <a th:href="@{/wrong-notes}" class="font-medium text-slate-500 hover:underline">오답노트 보기</a>
    </div>
</main>
</body>
</html>
