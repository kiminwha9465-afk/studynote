<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('모의고사 결과')}"></head>
<body class="min-h-screen bg-slate-50 dark:bg-zinc-900">
<div th:replace="~{fragments/common :: nav('exam')}"></div>

<main class="mx-auto max-w-3xl px-4 py-8">
    <h1 class="mb-1 text-xl font-bold text-slate-800 dark:text-zinc-100" th:text="${result.title}"></h1>

    <div class="mb-6 rounded-lg border bg-white p-5 shadow-sm dark:bg-zinc-800 dark:border-zinc-700">
        <p class="text-3xl font-bold text-indigo-600">
            <span th:text="${result.scorePercent()}"></span><span class="text-lg">점</span>
        </p>
        <p class="mt-1 text-sm text-slate-500 dark:text-zinc-400">
            <span th:text="${result.correctCount()}"></span> / <span th:text="${result.totalCount()}"></span> 문제 정답
        </p>
    </div>

    <!-- 과목별 점수 -->
    <div class="mb-6 grid grid-cols-2 gap-2 sm:grid-cols-5" th:if="${not #lists.isEmpty(result.subjectStats())}">
        <div th:each="s : ${result.subjectStats()}"
             class="rounded-lg border bg-white p-3 shadow-sm text-center dark:bg-zinc-800 dark:border-zinc-700">
            <p class="mb-1 truncate text-xs text-slate-500 dark:text-zinc-400" th:text="${s.subject().label}"></p>
            <p class="text-xl font-bold"
               th:classappend="${s.scorePercent() >= 40} ? 'text-indigo-600 dark:text-indigo-400' : 'text-red-500 dark:text-red-400'"
               th:text="${s.scorePercent()} + '점'"></p>
            <p class="text-xs text-slate-400 dark:text-zinc-500"
               th:text="${s.correct()} + '/' + ${s.total()} + ' 정답'"></p>
        </div>
    </div>

    <div class="flex flex-col gap-3">
        <div class="rounded-lg border bg-white p-4 shadow-sm dark:bg-zinc-800 dark:border-zinc-700" th:each="r, iter : ${result.results()}"
             th:classappend="${r.correct()} ? '' : 'border-red-200 dark:border-red-800'">
            <div class="mb-1 flex items-center gap-2">
                <span class="text-xs font-semibold text-slate-400 dark:text-zinc-500" th:text="${iter.count} + '.'"></span>
                <span class="rounded bg-indigo-50 px-2 py-0.5 text-xs font-semibold text-indigo-600 dark:bg-indigo-900/40 dark:text-indigo-300" th:text="${r.question().subject.label}"></span>
                <span class="text-xs font-semibold" th:classappend="${r.correct()} ? 'text-green-600 dark:text-green-400' : 'text-red-600 dark:text-red-400'"
                      th:text="${r.correct()} ? '정답' : '오답'"></span>
            </div>
            <a th:href="@{/questions/{id}(id=${r.question().id})}"
               class="font-medium text-slate-800 hover:text-indigo-600 dark:text-zinc-100 dark:hover:text-indigo-400" th:utext="${r.question().content}"></a>
            <p th:if="${!r.correct()}" class="mt-1 text-sm text-slate-600 dark:text-zinc-300">
                내가 고른 답: <span class="font-semibold text-red-600 dark:text-red-400" th:text="${r.selectedAnswer()}"></span>번
                / 정답: <span class="font-semibold text-green-600 dark:text-green-400" th:text="${r.question().answerNo}"></span>번
            </p>
        </div>
    </div>

    <div class="mt-6 flex gap-4 text-sm">
        <a th:href="@{/exam}" class="font-medium text-indigo-600 hover:underline dark:text-indigo-400">모의고사 다시 시작</a>
        <a th:href="@{/wrong-notes}" class="font-medium text-slate-500 hover:underline dark:text-zinc-400">오답노트 보기</a>
    </div>
</main>
</body>
</html>
