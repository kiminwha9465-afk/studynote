<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('정보처리기사 문제풀이')}"></head>
<body class="min-h-screen bg-slate-50 dark:bg-zinc-900">
<div th:replace="~{fragments/common :: nav('questions')}"></div>

<main class="mx-auto max-w-3xl px-4 py-8">
    <h1 class="mb-4 text-xl font-bold text-slate-800 dark:text-zinc-100">문제 목록</h1>

    <div class="mb-6 flex flex-wrap gap-2">
        <a th:href="@{/questions}"
           th:classappend="${selectedSubject == null} ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border hover:bg-slate-100 dark:bg-zinc-800 dark:text-zinc-300 dark:border-zinc-600 dark:hover:bg-zinc-700'"
           class="rounded-full px-3 py-1 text-sm font-medium">전체</a>
        <a th:each="s : ${subjects}"
           th:href="@{/questions(subject=${s})}"
           th:text="${s.label}"
           th:classappend="${selectedSubject == s} ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border hover:bg-slate-100 dark:bg-zinc-800 dark:text-zinc-300 dark:border-zinc-600 dark:hover:bg-zinc-700'"
           class="rounded-full px-3 py-1 text-sm font-medium"></a>
    </div>

    <div th:if="${#lists.isEmpty(questions)}" class="rounded-lg border border-dashed p-8 text-center text-slate-400 dark:border-zinc-600 dark:text-zinc-500">
        등록된 문제가 없습니다.
    </div>

    <div class="flex flex-col gap-3">
        <a th:each="q : ${questions}" th:href="@{/questions/{id}(id=${q.id})}"
           class="block rounded-lg border bg-white p-4 shadow-sm transition hover:shadow-md hover:border-indigo-300 dark:bg-zinc-800 dark:border-zinc-700 dark:hover:border-indigo-500">
            <div class="mb-2 flex items-center gap-2">
                <span class="rounded bg-indigo-50 px-2 py-0.5 text-xs font-semibold text-indigo-600 dark:bg-indigo-900/40 dark:text-indigo-300" th:text="${q.subject.label}"></span>
                <span th:if="${q.examYear != null}" class="text-xs text-slate-400 dark:text-zinc-500" th:text="${q.examYear} + '년 ' + ${q.examRound} + '회'"></span>
                <span th:if="${q.theme != null}" class="text-xs text-slate-400 dark:text-zinc-500" th:text="${q.theme}"></span>
            </div>
            <p class="font-medium text-slate-800 dark:text-zinc-100" th:text="${q.content}"></p>
        </a>
    </div>
</main>
</body>
</html>
