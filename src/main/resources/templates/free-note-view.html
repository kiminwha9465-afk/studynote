<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${note.title}">자유노트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill-better-table@1.2.10/src/assets/quill-better-table.css">
    <style>
        .ql-editor { padding: 1.25rem 1.5rem; min-height: 200px; }
        .ql-snow.ql-container { border: none; }
        .ql-better-table td, .ql-better-table th { border: 1px solid #cbd5e1; padding: 6px 10px; }
    </style>
</head>
<body class="min-h-screen bg-slate-50">
<div th:replace="~{fragments/common :: nav('free-notes')}"></div>

<main class="mx-auto max-w-3xl px-4 py-8">

    <div class="mb-4 flex items-center justify-between">
        <a th:href="@{/free-notes}"
           class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-slate-700">
            ← 목록으로
        </a>
        <a th:href="@{/free-notes/{id}/edit(id=${note.id})}"
           class="rounded-md border border-slate-300 px-4 py-1.5 text-sm font-semibold text-slate-600 hover:bg-slate-50">
            편집
        </a>
    </div>

    <div class="rounded-lg border bg-white shadow-sm">
        <div class="border-b px-6 py-4">
            <h1 class="text-xl font-bold text-slate-800" th:text="${note.title}"></h1>
            <p class="mt-1 text-xs text-slate-400"
               th:text="${#temporals.format(note.updatedAt, 'yyyy년 MM월 dd일 HH:mm')}"></p>
        </div>
        <!-- Quill CSS가 적용된 뷰어 -->
        <div class="ql-snow">
            <div class="ql-editor" th:utext="${note.content}"></div>
        </div>
    </div>

</main>
</body>
</html>
