<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${note.title}">자유노트</title>
    <script>
        (function() {
            var t = localStorage.getItem('theme');
            if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        .note-content { font-family: -apple-system, sans-serif; font-size: 15px; line-height: 1.7; color: #1e293b; }
        .note-content h1 { font-size: 1.5em; font-weight: 700; margin: 1em 0 0.4em; }
        .note-content h2 { font-size: 1.25em; font-weight: 700; margin: 1em 0 0.4em; }
        .note-content h3 { font-size: 1.1em; font-weight: 700; margin: 1em 0 0.4em; }
        .note-content p { margin: 0.5em 0; }
        .note-content ul { list-style: disc; padding-left: 1.6em; margin: 0.5em 0; }
        .note-content ol { list-style: decimal; padding-left: 1.6em; margin: 0.5em 0; }
        .note-content strong, .note-content b { font-weight: 700; }
        .note-content em, .note-content i { font-style: italic; }
        .note-content a { color: #4f46e5; text-decoration: underline; }
        .note-content blockquote { border-left: 4px solid #e2e8f0; padding: 0.5em 1em; color: #64748b; margin: 0.75em 0; }
        .note-content pre { background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 6px; padding: 1em 1.2em; font-size: 0.875em; overflow-x: auto; margin: 0.75em 0; }
        .note-content code:not([class]) { background: #f1f5f9; padding: 0.15em 0.4em; border-radius: 3px; font-size: 0.875em; }
        .note-content img { max-width: 100%; height: auto; border-radius: 4px; margin: 0.5em 0; }
        .note-content table { border-collapse: collapse; width: 100%; margin: 0.75em 0; }
        .note-content table td, .note-content table th { border: 1px solid #cbd5e1; padding: 8px 12px; vertical-align: top; }
        .note-content table th { background: #f8fafc; font-weight: 600; }

        .dark .note-content { color: #e2e8f0; }
        .dark .note-content a { color: #818cf8; }
        .dark .note-content blockquote { border-left-color: #475569; color: #94a3b8; }
        .dark .note-content pre { background: #0f172a; border-color: #334155; }
        .dark .note-content code:not([class]) { background: #1e293b; }
        .dark .note-content table td, .dark .note-content table th { border-color: #334155; }
        .dark .note-content table th { background: #1e293b; }
    </style>
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-900">
<div th:replace="~{fragments/common :: nav('free-notes')}"></div>

<main class="mx-auto max-w-3xl px-4 py-8">

    <div class="mb-4 flex items-center justify-between">
        <a th:href="@{/free-notes}"
           class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200">
            ← 목록으로
        </a>
        <div class="flex gap-2">
            <a th:href="@{/free-notes/{id}/edit(id=${note.id})}"
               class="rounded-md border border-slate-300 px-4 py-1.5 text-sm font-semibold text-slate-600 hover:bg-slate-50 dark:border-slate-600 dark:text-slate-300 dark:hover:bg-slate-700">
                편집
            </a>
            <form th:action="@{/free-notes/{id}/delete(id=${note.id})}" method="post">
                <button type="submit"
                        onclick="return confirm('정말 삭제하시겠어요?')"
                        class="rounded-md bg-red-50 px-4 py-1.5 text-sm font-semibold text-red-600 hover:bg-red-100 dark:bg-red-900/30 dark:text-red-400 dark:hover:bg-red-900/50">
                    삭제
                </button>
            </form>
        </div>
    </div>

    <div class="rounded-lg border bg-white shadow-sm dark:bg-slate-800 dark:border-slate-700">
        <div class="border-b px-6 py-4 dark:border-slate-700">
            <h1 class="text-xl font-bold text-slate-800 dark:text-slate-100" th:text="${note.title}"></h1>
            <p class="mt-1 text-xs text-slate-400 dark:text-slate-500"
               th:text="${#temporals.format(note.updatedAt, 'yyyy년 MM월 dd일 HH:mm')}"></p>
        </div>
        <div class="note-content px-6 py-5" th:utext="${note.content}"></div>
    </div>

</main>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-coy.min.css">
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
</body>
</html>
