<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('자유노트')}"></head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-900">
<div th:replace="~{fragments/common :: nav('free-notes')}"></div>

<main class="mx-auto max-w-3xl px-4 py-8">
    <div class="mb-6 flex items-center justify-between">
        <h1 class="text-xl font-bold text-slate-800 dark:text-slate-100">자유노트</h1>
        <a th:href="@{/free-notes/new}"
           class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-700">
            + 새 노트
        </a>
    </div>

    <div th:if="${#lists.isEmpty(notes)}"
         class="rounded-lg border border-dashed p-10 text-center text-slate-400 dark:border-slate-600 dark:text-slate-500">
        <p class="mb-1 font-medium">아직 작성한 노트가 없습니다.</p>
        <p class="text-xs">표, 이미지 등을 자유롭게 기록해보세요.</p>
    </div>

    <div class="flex flex-col gap-3">
        <a th:each="note : ${notes}"
           th:href="@{/free-notes/{id}(id=${note.id})}"
           class="flex items-center justify-between rounded-lg border bg-white px-5 py-4 shadow-sm hover:border-indigo-300 hover:shadow-md transition-all dark:bg-slate-800 dark:border-slate-700 dark:hover:border-indigo-500">
            <div class="min-w-0">
                <p class="truncate font-semibold text-slate-800 dark:text-slate-100" th:text="${note.title}"></p>
                <p class="mt-0.5 text-xs text-slate-400 dark:text-slate-500"
                   th:text="${#temporals.format(note.updatedAt, 'yyyy년 MM월 dd일 HH:mm')}"></p>
            </div>
            <span class="ml-4 shrink-0 text-slate-300 dark:text-slate-600">→</span>
        </a>
    </div>
</main>
</body>
</html>
