<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('정보처리기사 문제풀이')}"></head>
<body class="min-h-screen bg-slate-50 dark:bg-zinc-900">
<div th:replace="~{fragments/common :: nav('questions')}"></div>

<main class="mx-auto max-w-3xl px-4 py-8">
    <div class="mb-3 flex items-center gap-2">
        <span class="rounded bg-indigo-50 px-2 py-0.5 text-xs font-semibold text-indigo-600 dark:bg-indigo-900/40 dark:text-indigo-300" th:text="${question.subject.label}"></span>
        <span th:if="${question.examYear != null}" class="text-xs text-slate-400 dark:text-zinc-500" th:text="${question.examYear} + '년 ' + ${question.examRound} + '회'"></span>
        <span th:if="${question.theme != null}" class="text-xs text-slate-400 dark:text-zinc-500" th:text="${question.theme}"></span>
    </div>

    <h1 class="mb-6 text-lg font-semibold text-slate-800 dark:text-zinc-100" th:utext="${question.content}"></h1>

    <form method="post" th:action="@{/questions/{id}/answer(id=${question.id})}" class="flex flex-col gap-2">
        <label th:each="i : ${#numbers.sequence(1, 4)}"
               class="flex items-center gap-3 rounded-lg border bg-white px-4 py-3 transition dark:bg-zinc-800 dark:border-zinc-600"
               th:classappend="${
                   result == null ? 'cursor-pointer hover:border-indigo-300 hover:bg-indigo-50/40 dark:hover:border-indigo-500 dark:hover:bg-indigo-900/20' :
                   (i == question.answerNo) ? 'border-green-400 bg-green-50 dark:border-green-700 dark:bg-green-900/30' :
                   (i == result.selectedAnswer()) ? 'border-red-300 bg-red-50 dark:border-red-700 dark:bg-red-900/30' : 'opacity-60'
               }">
            <input type="radio" name="selectedAnswer" th:value="${i}"
                   th:checked="${result != null and result.selectedAnswer() == i}"
                   th:disabled="${result != null}" required
                   class="h-4 w-4 accent-indigo-600">
            <span class="text-slate-700 dark:text-zinc-200" th:utext="${i} + '. ' + ${
                i == 1 ? question.choice1 :
                i == 2 ? question.choice2 :
                i == 3 ? question.choice3 :
                question.choice4}"></span>
        </label>

        <button type="submit" th:if="${result == null}"
                class="mt-2 self-start rounded-md bg-indigo-600 px-5 py-2 text-sm font-semibold text-white hover:bg-indigo-700">
            제출
        </button>
    </form>

    <div th:if="${result != null}"
         class="mt-5 rounded-lg border p-4"
         th:classappend="${result.correct()} ? 'border-green-300 bg-green-50 dark:border-green-700 dark:bg-green-900/30' : 'border-red-300 bg-red-50 dark:border-red-700 dark:bg-red-900/30'">
        <p class="font-semibold" th:classappend="${result.correct()} ? 'text-green-700 dark:text-green-400' : 'text-red-700 dark:text-red-400'"
           th:text="${result.correct()} ? '정답입니다!' : '오답입니다.'"></p>
        <p class="mt-1 text-sm text-slate-600 dark:text-zinc-300">정답: <span class="font-medium" th:text="${question.multiAnswer != null ? question.multiAnswer : question.answerNo}"></span>번</p>
        <p class="mt-2 text-sm text-slate-600 dark:text-zinc-300" th:utext="${question.explanation}"></p>
    </div>

    <div th:if="${result != null}" class="mt-4 flex gap-4 text-sm">
        <a th:href="@{/questions/{id}(id=${question.id})}" class="font-medium text-indigo-600 hover:underline dark:text-indigo-400">다시 풀기</a>
        <a th:href="@{/questions(subject=${question.subject})}" class="font-medium text-slate-500 hover:underline dark:text-zinc-400">목록으로</a>
    </div>
</main>
</body>
</html>
