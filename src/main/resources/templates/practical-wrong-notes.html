<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('실기 오답노트')}"></head>
<body class="min-h-screen bg-slate-50 dark:bg-zinc-900">
<div th:replace="~{fragments/common :: nav('practical-wrong-notes')}"></div>

<main class="mx-auto max-w-3xl px-4 py-8">
    <div class="mb-6 flex items-center justify-between">
        <h1 class="text-xl font-bold text-slate-800 dark:text-zinc-100">실기 오답노트</h1>
        <div class="flex items-center gap-3">
            <form method="post" th:action="@{/practical/wrong-notes/re-evaluate}">
                <button type="submit"
                        class="rounded-md border border-slate-300 bg-white px-3 py-1.5 text-xs font-semibold text-slate-600
                               hover:bg-slate-50 dark:bg-zinc-700 dark:border-zinc-600 dark:text-zinc-300 dark:hover:bg-zinc-600">
                    오답 재채점
                </button>
            </form>
            <a th:href="@{/practical}"
               class="text-sm text-slate-500 hover:text-slate-700 dark:text-zinc-400 dark:hover:text-zinc-200">← 실기 홈</a>
        </div>
    </div>

    <div th:if="${errorMessage}"
         class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-2.5 text-sm text-red-700 dark:bg-red-900/20 dark:border-red-700/40 dark:text-red-300"
         th:text="${errorMessage}"></div>

    <div th:if="${loadError}"
         class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-2.5 text-sm text-red-700 dark:bg-red-900/20 dark:border-red-700/40 dark:text-red-300"
         th:text="'오류: ' + ${loadError}"></div>

    <div th:if="${reEvaluateResult}"
         class="mb-4 rounded-md bg-green-50 border border-green-200 px-4 py-2.5 text-sm text-green-700 dark:bg-green-900/20 dark:border-green-700/40 dark:text-green-300"
         th:text="${reEvaluateResult}"></div>

    <div th:if="${sessions.empty}"
         class="rounded-lg border border-dashed p-10 text-center text-slate-400 dark:border-zinc-600 dark:text-zinc-500">
        <p class="text-base font-medium">오답 기록이 없습니다.</p>
        <p class="mt-1 text-sm">문제를 풀면 틀린 문제가 자동으로 저장됩니다.</p>
    </div>

    <div class="flex flex-col gap-3">
        <div th:each="s : ${sessions}"
             class="flex items-center justify-between rounded-lg border bg-white shadow-sm hover:border-indigo-300 hover:shadow-md transition-all dark:bg-zinc-800 dark:border-zinc-700 dark:hover:border-indigo-500">

            <a th:href="@{/practical/wrong-notes/session/{key}(key=${s.sessionKey()})}"
               class="min-w-0 flex-1 px-5 py-4">
                <p class="truncate font-semibold text-slate-800 dark:text-zinc-100" th:text="${s.title()}"></p>
                <p class="mt-0.5 text-xs text-slate-400 dark:text-zinc-500"
                   th:text="${#temporals.format(s.solvedAt(), 'yyyy년 MM월 dd일 HH:mm')}"></p>
            </a>

            <div class="ml-2 flex shrink-0 items-center gap-3 pr-3 text-sm">
                <span class="text-sm font-bold"
                      th:classappend="${s.scorePercent() >= 60} ? 'text-indigo-600 dark:text-indigo-400' : 'text-red-500 dark:text-red-400'"
                      th:text="${#numbers.formatDecimal(s.scorePercent(), 1, 1)} + '%'"></span>
                <span class="rounded-full bg-green-50 px-3 py-1 font-semibold text-green-700 dark:bg-green-900/30 dark:text-green-400"
                      th:text="${s.correctCount()} + '/' + ${s.totalCount()} + ' 정답'"></span>
                <form th:action="@{/practical/wrong-notes/session/{key}/delete(key=${s.sessionKey()})}" method="post"
                      onsubmit="return confirm('이 시험 기록을 삭제할까요?')">
                    <button type="submit"
                            class="rounded-md border border-red-300 px-2 py-1 text-xs font-medium text-red-500 hover:bg-red-50 dark:border-red-700 dark:text-red-400 dark:hover:bg-red-900/20">
                        삭제
                    </button>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
