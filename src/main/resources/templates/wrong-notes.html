<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('오답노트')}"></head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-900">
<div th:replace="~{fragments/common :: nav('wrong-notes')}"></div>

<main class="mx-auto max-w-3xl px-4 py-8">
    <h1 class="mb-5 text-xl font-bold text-slate-800 dark:text-slate-100">오답노트</h1>

    <div th:if="${errorMessage}"
         class="mb-4 rounded-md bg-red-50 px-4 py-3 text-sm text-red-700 border border-red-200 dark:bg-red-900/30 dark:border-red-800 dark:text-red-300"
         th:text="${errorMessage}"></div>

    <!-- 모드 탭 -->
    <div class="mb-6 flex gap-1 border-b border-slate-200 dark:border-slate-700">
        <a th:href="@{/wrong-notes(mode='mock')}"
           th:classappend="${mode == 'mock'} ? 'border-b-2 border-indigo-600 text-indigo-600' : 'text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200'"
           class="px-4 py-2 text-sm font-semibold">모의고사</a>
        <a th:href="@{/wrong-notes(mode='year')}"
           th:classappend="${mode == 'year'} ? 'border-b-2 border-indigo-600 text-indigo-600' : 'text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200'"
           class="px-4 py-2 text-sm font-semibold">지정년도</a>
        <a th:href="@{/wrong-notes(mode='practice')}"
           th:classappend="${mode == 'practice'} ? 'border-b-2 border-indigo-600 text-indigo-600' : 'text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200'"
           class="px-4 py-2 text-sm font-semibold">임의풀이</a>
    </div>

    <!-- ===== 모의고사 / 지정년도: 세션 목록 ===== -->
    <div th:if="${mode == 'mock' or mode == 'year'}">

        <!-- 빈 상태 -->
        <div th:if="${#lists.isEmpty(sessions)}"
             class="rounded-lg border border-dashed p-10 text-center text-slate-400 dark:border-slate-600 dark:text-slate-500">
            <p class="mb-1 font-medium">아직 풀이 기록이 없습니다.</p>
            <p class="text-xs">시험 모드에서 문제를 풀면 여기에 기록이 쌓입니다.</p>
        </div>

        <!-- 세션 카드 목록 -->
        <div class="flex flex-col gap-3">
            <a th:each="s : ${sessions}"
               th:href="@{/wrong-notes/session/{id}(id=${s.session.id})}"
               class="flex items-center justify-between rounded-lg border bg-white px-5 py-4 shadow-sm hover:border-indigo-300 hover:shadow-md transition-all dark:bg-slate-800 dark:border-slate-700 dark:hover:border-indigo-500">

                <div class="min-w-0">
                    <p class="truncate font-semibold text-slate-800 dark:text-slate-100" th:text="${s.session.title}"></p>
                    <p class="mt-0.5 text-xs text-slate-400 dark:text-slate-500"
                       th:text="${#temporals.format(s.session.createdAt, 'yyyy년 MM월 dd일 HH:mm')}"></p>
                </div>

                <div class="ml-4 flex shrink-0 items-center gap-3 text-sm">
                    <span class="text-sm font-bold"
                          th:classappend="${s.scorePercent() >= 60} ? 'text-indigo-600 dark:text-indigo-400' : 'text-red-500 dark:text-red-400'"
                          th:text="${s.scorePercent()} + '점'"></span>
                    <span class="rounded-full bg-green-50 px-3 py-1 font-semibold text-green-700 dark:bg-green-900/30 dark:text-green-400"
                          th:text="${s.correctCount} + '/' + ${s.totalCount} + ' 정답'"></span>
                    <span th:if="${s.wrongCount > 0}"
                          class="rounded-full bg-red-50 px-3 py-1 font-semibold text-red-600 dark:bg-red-900/30 dark:text-red-400"
                          th:text="${s.wrongCount} + ' 오답'"></span>
                    <span class="text-slate-300 dark:text-slate-600">→</span>
                </div>
            </a>
        </div>
    </div>

    <!-- ===== 임의풀이: 오답 목록 ===== -->
    <div th:if="${mode == 'practice'}">
        <div class="mb-4 flex items-center justify-between gap-4">
            <p class="rounded-md bg-slate-100 px-4 py-2 text-sm text-slate-600 dark:bg-slate-700 dark:text-slate-300">
                임의풀이에서 틀렸다가 나중에 맞히면 목록에서 사라집니다.
            </p>
            <a th:if="${!#lists.isEmpty(wrongRecords)}"
               th:href="@{/exam/retry/practice}"
               class="shrink-0 rounded-md bg-red-500 px-4 py-2 text-sm font-semibold text-white hover:bg-red-600">
                오답 다시 풀기
            </a>
        </div>

        <div th:if="${#lists.isEmpty(wrongRecords)}"
             class="rounded-lg border border-dashed p-10 text-center text-slate-400 dark:border-slate-600 dark:text-slate-500">
            아직 틀린 문제가 없습니다.
        </div>

        <div class="flex flex-col gap-6">
            <div class="rounded-lg border bg-white p-5 shadow-sm dark:bg-slate-800 dark:border-slate-700" th:each="r : ${wrongRecords}">

                <div class="mb-3 flex flex-wrap items-center gap-2">
                    <span class="rounded bg-indigo-50 px-2 py-0.5 text-xs font-semibold text-indigo-600 dark:bg-indigo-900/40 dark:text-indigo-300"
                          th:text="${r.question.subject.label}"></span>
                    <span th:if="${r.question.examYear != null}"
                          class="rounded bg-slate-100 px-2 py-0.5 text-xs text-slate-500 dark:bg-slate-700 dark:text-slate-400"
                          th:text="${r.question.examYear} + '년 ' + ${r.question.examRound} + '회'"></span>
                </div>

                <div class="mb-4 font-medium leading-relaxed text-slate-800 dark:text-slate-100"
                     th:utext="${r.question.content}"></div>

                <div class="mb-4 space-y-2">
                    <div class="flex items-start gap-2 rounded-md px-3 py-2 text-sm"
                         th:classappend="${r.question.answerNo == 1} ? 'bg-green-50 font-semibold text-green-800 dark:bg-green-900/30 dark:text-green-300' :
                                         (${r.selectedAnswer == 1} ? 'bg-red-50 text-red-800 dark:bg-red-900/30 dark:text-red-300' : 'bg-slate-50 text-slate-700 dark:bg-slate-700 dark:text-slate-300')">
                        <span class="shrink-0 font-medium">①</span>
                        <span th:utext="${r.question.choice1}"></span>
                    </div>
                    <div class="flex items-start gap-2 rounded-md px-3 py-2 text-sm"
                         th:classappend="${r.question.answerNo == 2} ? 'bg-green-50 font-semibold text-green-800 dark:bg-green-900/30 dark:text-green-300' :
                                         (${r.selectedAnswer == 2} ? 'bg-red-50 text-red-800 dark:bg-red-900/30 dark:text-red-300' : 'bg-slate-50 text-slate-700 dark:bg-slate-700 dark:text-slate-300')">
                        <span class="shrink-0 font-medium">②</span>
                        <span th:utext="${r.question.choice2}"></span>
                    </div>
                    <div class="flex items-start gap-2 rounded-md px-3 py-2 text-sm"
                         th:classappend="${r.question.answerNo == 3} ? 'bg-green-50 font-semibold text-green-800 dark:bg-green-900/30 dark:text-green-300' :
                                         (${r.selectedAnswer == 3} ? 'bg-red-50 text-red-800 dark:bg-red-900/30 dark:text-red-300' : 'bg-slate-50 text-slate-700 dark:bg-slate-700 dark:text-slate-300')">
                        <span class="shrink-0 font-medium">③</span>
                        <span th:utext="${r.question.choice3}"></span>
                    </div>
                    <div class="flex items-start gap-2 rounded-md px-3 py-2 text-sm"
                         th:classappend="${r.question.answerNo == 4} ? 'bg-green-50 font-semibold text-green-800 dark:bg-green-900/30 dark:text-green-300' :
                                         (${r.selectedAnswer == 4} ? 'bg-red-50 text-red-800 dark:bg-red-900/30 dark:text-red-300' : 'bg-slate-50 text-slate-700 dark:bg-slate-700 dark:text-slate-300')">
                        <span class="shrink-0 font-medium">④</span>
                        <span th:utext="${r.question.choice4}"></span>
                    </div>
                </div>

                <p class="mb-3 text-sm">
                    <span class="font-semibold text-red-600 dark:text-red-400">내가 고른 답: <span th:text="${r.selectedAnswer}"></span>번</span>
                    <span class="mx-1 text-slate-300 dark:text-slate-600">|</span>
                    <span class="font-semibold text-green-700 dark:text-green-400">정답: <span th:text="${r.question.answerNo}"></span>번</span>
                </p>

                <div th:if="${r.question.explanation != null and !#strings.isEmpty(r.question.explanation)}"
                     class="mb-3 rounded-md bg-amber-50 px-3 py-2 text-sm text-slate-700 dark:bg-amber-900/20 dark:text-slate-300"
                     th:utext="${r.question.explanation}"></div>

                <form method="post" th:action="@{/wrong-notes/{id}/memo(id=${r.id})}">
                    <input type="hidden" name="mode" value="practice">
                    <textarea name="memo" placeholder="오답 메모를 남겨보세요" th:text="${r.memo}"
                              class="w-full rounded-md border p-2 text-sm focus:border-indigo-400 focus:outline-none dark:bg-slate-700 dark:border-slate-600 dark:text-slate-200 dark:placeholder-slate-500"
                              rows="2"></textarea>
                    <button type="submit"
                            class="mt-2 rounded-md bg-slate-700 px-4 py-1.5 text-sm font-medium text-white hover:bg-slate-800 dark:bg-slate-600 dark:hover:bg-slate-500">
                        메모 저장
                    </button>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
