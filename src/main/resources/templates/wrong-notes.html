<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('오답노트')}"></head>
<body class="min-h-screen bg-slate-50">
<div th:replace="~{fragments/common :: nav('wrong-notes')}"></div>

<main class="mx-auto max-w-3xl px-4 py-8">
    <h1 class="mb-4 text-xl font-bold text-slate-800">오답노트</h1>

    <div th:if="${#lists.isEmpty(wrongRecords)}" class="rounded-lg border border-dashed p-8 text-center text-slate-400">
        아직 틀린 문제가 없습니다. (또는 모두 다시 맞혔습니다!)
    </div>

    <div class="flex flex-col gap-4">
        <div class="rounded-lg border bg-white p-4 shadow-sm" th:each="r : ${wrongRecords}">
            <div class="mb-2 flex items-center gap-2">
                <span class="rounded bg-indigo-50 px-2 py-0.5 text-xs font-semibold text-indigo-600" th:text="${r.question.subject.label}"></span>
            </div>

            <a th:href="@{/questions/{id}(id=${r.question.id})}"
               class="font-medium text-slate-800 hover:text-indigo-600" th:text="${r.question.content}"></a>

            <p class="mt-2 text-sm text-slate-600">
                내가 고른 답: <span class="font-semibold text-red-600" th:text="${r.selectedAnswer}"></span>번
                / 정답: <span class="font-semibold text-green-600" th:text="${r.question.answerNo}"></span>번
            </p>
            <p class="mt-1 text-sm text-slate-500" th:text="${r.question.explanation}"></p>

            <form method="post" th:action="@{/wrong-notes/{id}/memo(id=${r.id})}" class="mt-3">
                <textarea name="memo" placeholder="오답 메모를 남겨보세요" th:text="${r.memo}"
                          class="w-full rounded-md border p-2 text-sm focus:border-indigo-400 focus:outline-none"
                          rows="2"></textarea>
                <button type="submit"
                        class="mt-2 rounded-md bg-slate-700 px-4 py-1.5 text-sm font-medium text-white hover:bg-slate-800">
                    메모 저장
                </button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
