<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('모의고사 응시')}"></head>
<body class="min-h-screen bg-slate-50 dark:bg-zinc-900">
<div th:replace="~{fragments/common :: nav('exam')}"></div>

<main class="mx-auto max-w-3xl px-4 py-8">
    <div class="mb-1 flex items-center justify-between">
        <h1 class="text-xl font-bold text-slate-800 dark:text-zinc-100" th:text="${title}"></h1>
        <span class="font-mono text-sm font-semibold text-indigo-600 dark:text-indigo-400" id="timer">00:00</span>
    </div>
    <p class="mb-6 text-sm text-slate-500 dark:text-zinc-400">모든 문제에 답을 고른 뒤 제출하세요.</p>

    <div id="unanswered-toast"
         class="fixed left-1/2 top-4 z-50 hidden w-[90%] max-w-md -translate-x-1/2 rounded-md bg-red-600 px-4 py-3 text-center text-sm font-semibold text-white shadow-lg"></div>

    <form method="post" th:action="@{/exam/submit}" class="flex flex-col gap-4" novalidate>
        <input type="hidden" name="elapsedSeconds" id="elapsedSeconds" value="0">
        <div class="js-question rounded-lg border bg-white p-4 shadow-sm dark:bg-zinc-800 dark:border-zinc-700"
             th:each="q, iter : ${questions}" th:data-question-no="${iter.count}">
            <div class="mb-2 flex items-center gap-2">
                <span class="text-xs font-semibold text-slate-400 dark:text-zinc-500" th:text="${iter.count} + '.'"></span>
                <span class="rounded bg-indigo-50 px-2 py-0.5 text-xs font-semibold text-indigo-600 dark:bg-indigo-900/40 dark:text-indigo-300" th:text="${q.subject.label}"></span>
                <span th:if="${q.examYear != null}" class="text-xs text-slate-400 dark:text-zinc-500" th:text="${q.examYear} + '년 ' + ${q.examRound} + '회'"></span>
                <span th:if="${q.theme != null}" class="text-xs text-slate-400 dark:text-zinc-500" th:text="${q.theme}"></span>
            </div>
            <p class="mb-3 font-medium text-slate-800 dark:text-zinc-100" th:utext="${q.content}"></p>

            <label th:each="i : ${#numbers.sequence(1, 4)}"
                   class="mb-1 flex items-center gap-3 rounded-md border px-3 py-2 text-sm text-slate-700 hover:border-indigo-300 hover:bg-indigo-50/40 dark:border-zinc-600 dark:text-zinc-200 dark:hover:border-indigo-500 dark:hover:bg-indigo-900/20">
                <input type="radio" th:name="${'answer_' + q.id}" th:value="${i}" required
                       class="h-4 w-4 accent-indigo-600">
                <span th:utext="${i} + '. ' + ${
                    i == 1 ? q.choice1 :
                    i == 2 ? q.choice2 :
                    i == 3 ? q.choice3 :
                    q.choice4}"></span>
            </label>
        </div>

        <button type="submit"
                class="sticky bottom-4 self-center rounded-md bg-indigo-600 px-8 py-2.5 text-sm font-semibold text-white shadow-lg hover:bg-indigo-700">
            제출하기
        </button>
    </form>
</main>
<script>
    var submitted = false;
    var startTime = Date.now();
    var timerEl = document.getElementById('timer');
    var elapsedEl = document.getElementById('elapsedSeconds');
    var toastEl = document.getElementById('unanswered-toast');

    setInterval(function() {
        var s = Math.floor((Date.now() - startTime) / 1000);
        timerEl.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    }, 1000);

    function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.remove('hidden');
        setTimeout(function() { toastEl.classList.add('hidden'); }, 4000);
    }

    // 답을 고르지 않은 문제가 있으면 어떤 문제인지 명확히 알려주고 제출을 막는다.
    // (required만으로는 브라우저가 조용히 첫 미응답 문항으로만 스크롤해서, 긴 시험지에서는 놓치기 쉬웠다)
    document.querySelector('form').addEventListener('submit', function(e) {
        var blocks = document.querySelectorAll('.js-question');
        var unanswered = [];
        blocks.forEach(function(block) {
            block.classList.remove('ring-2', 'ring-red-500');
            if (!block.querySelector('input[type=radio]:checked')) {
                unanswered.push(block);
            }
        });

        if (unanswered.length > 0) {
            e.preventDefault();
            unanswered.forEach(function(block) { block.classList.add('ring-2', 'ring-red-500'); });
            var nums = unanswered.map(function(b) { return b.dataset.questionNo; });
            var label = nums.length > 5 ? nums.slice(0, 5).join(', ') + '번 외 ' + (nums.length - 5) + '문제' : nums.join(', ') + '번';
            showToast(label + '에 답을 선택하지 않았습니다.');
            unanswered[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
            return;
        }

        elapsedEl.value = Math.floor((Date.now() - startTime) / 1000);
        submitted = true;
    });

    // 뒤로가기·탭닫기 등 이탈 시 자동 저장
    window.addEventListener('pagehide', function() {
        if (!submitted && navigator.sendBeacon) {
            var data = new URLSearchParams(new FormData(document.querySelector('form')));
            navigator.sendBeacon('/exam/submit', data);
            submitted = true;
        }
    });

    // 브라우저 뒤로가기로 캐시된 페이지 복귀 시 재로드 (이중 제출 방지)
    window.addEventListener('pageshow', function(e) {
        if (e.persisted) window.location.reload();
    });
</script>
</body>
</html>
