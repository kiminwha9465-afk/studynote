<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('실기 문제풀이')}"></head>
<body class="min-h-screen bg-slate-50 dark:bg-zinc-900">
<div th:replace="~{fragments/common :: nav('practical')}"></div>

<main class="mx-auto max-w-3xl px-4 py-8">
    <h1 class="mb-2 text-xl font-bold text-slate-800 dark:text-zinc-100">실기 문제풀이</h1>
    <p class="mb-8 text-sm text-slate-500 dark:text-zinc-400">회차를 선택하면 단답형으로 문제를 풀어볼 수 있습니다.</p>

    <section class="rounded-lg border bg-white p-5 shadow-sm dark:bg-zinc-800 dark:border-zinc-700">
        <h2 class="mb-1 text-base font-semibold text-slate-800 dark:text-zinc-100">회차별 기출문제</h2>
        <p class="mb-4 text-sm text-slate-500 dark:text-zinc-400">연도·회차를 선택하여 풀기 시작합니다.</p>

        <div th:if="${#lists.isEmpty(sittings)}"
             class="rounded-lg border border-dashed p-6 text-center text-slate-400 dark:border-zinc-600 dark:text-zinc-500">
            등록된 실기 회차 데이터가 없습니다.
        </div>

        <div class="flex flex-wrap gap-2">
            <form th:each="s : ${sittings}" method="post" th:action="@{/practical/year/start}">
                <input type="hidden" name="examYear"  th:value="${s.examYear}">
                <input type="hidden" name="examRound" th:value="${s.examRound}">
                <button type="submit"
                        class="rounded-full border bg-white px-3 py-1.5 text-sm font-medium text-slate-600
                               hover:border-indigo-300 hover:bg-indigo-50 hover:text-indigo-600
                               dark:bg-zinc-700 dark:border-zinc-600 dark:text-zinc-300
                               dark:hover:border-indigo-500 dark:hover:bg-indigo-900/30 dark:hover:text-indigo-300"
                        th:text="${s.examYear} + '년 ' + ${s.examRound} + '회'">
                </button>
            </form>
        </div>
    </section>

    <section class="mt-6 rounded-lg border border-amber-200 bg-amber-50 p-4 text-sm text-amber-800 dark:border-amber-700/40 dark:bg-amber-900/20 dark:text-amber-300">
        <p class="font-semibold mb-1">안내</p>
        <p>실기 문제는 수험생 복원 기출을 바탕으로 합니다. 대소문자·공백은 무시하며 채점합니다. 복수 정답이 허용된 문제는 허용 답안 중 하나를 입력하면 정답으로 인정됩니다.</p>
    </section>
</main>
</body>
</html>
