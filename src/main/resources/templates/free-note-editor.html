<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>노트 편집</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50">
<div th:replace="~{fragments/common :: nav('free-notes')}"></div>

<main class="mx-auto max-w-3xl px-4 py-8">

    <a th:href="${note != null ? '/free-notes/' + note.id : '/free-notes'}"
       class="mb-4 inline-flex items-center gap-1 text-sm text-slate-500 hover:text-slate-700">
        ← 목록으로
    </a>

    <form id="noteForm"
          th:action="${note != null ? '/free-notes/' + note.id : '/free-notes'}"
          method="post">

        <input type="text" name="title" placeholder="제목을 입력하세요"
               th:value="${note?.title}"
               class="mb-4 w-full rounded-lg border border-slate-200 px-4 py-3 text-lg font-semibold text-slate-800 focus:border-indigo-400 focus:outline-none">

        <!-- TinyMCE가 이 textarea를 에디터로 교체함. name="content"로 폼 전송 -->
        <textarea id="editor" name="content"
                  th:text="${note?.content}"></textarea>

        <div class="mt-4 flex items-center gap-3">
            <button type="submit"
                    class="rounded-md bg-indigo-600 px-5 py-2 text-sm font-semibold text-white hover:bg-indigo-700">
                저장
            </button>
            <a th:href="${note != null ? '/free-notes/' + note.id : '/free-notes'}"
               class="rounded-md border border-slate-300 px-5 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-50">
                취소
            </a>
            <form th:if="${note != null}"
                  th:action="@{/free-notes/{id}/delete(id=${note.id})}"
                  method="post" class="ml-auto">
                <button type="submit"
                        onclick="return confirm('정말 삭제하시겠어요?')"
                        class="rounded-md bg-red-50 px-5 py-2 text-sm font-semibold text-red-600 hover:bg-red-100">
                    삭제
                </button>
            </form>
        </div>
    </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/tinymce@6.8.3/tinymce.min.js"></script>
<script>
tinymce.init({
    selector: '#editor',
    base_url: 'https://cdn.jsdelivr.net/npm/tinymce@6.8.3',
    suffix: '.min',
    height: 520,
    plugins: 'table image link lists code',
    toolbar: [
        'undo redo | blocks | bold italic underline strikethrough | forecolor backcolor',
        'alignleft aligncenter alignright | numlist bullist | table | image link | code'
    ],
    toolbar_mode: 'wrap',
    table_toolbar: 'tableprops tabledelete | tableinsertrowbefore tableinsertrowafter tabledeleterow | tableinsertcolbefore tableinsertcolafter tabledeletecol',
    images_upload_handler: function(blobInfo) {
        return new Promise(function(resolve, reject) {
            var fd = new FormData();
            fd.append('file', blobInfo.blob(), blobInfo.filename());
            fetch('/free-notes/upload-image', {method: 'POST', body: fd})
                .then(function(r) { return r.json(); })
                .then(function(d) { resolve(d.url); })
                .catch(function() { reject('이미지 업로드 실패'); });
        });
    },
    content_style: 'body { font-family: -apple-system, sans-serif; font-size: 15px; line-height: 1.7; }'
});

// 폼 제출 전 TinyMCE 내용을 textarea에 동기화
document.getElementById('noteForm').addEventListener('submit', function() {
    tinymce.triggerSave();
});
</script>
</body>
</html>
