<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>노트 편집</title>
    <script>
        (function() {
            var t = localStorage.getItem('theme');
            if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="min-h-screen bg-slate-50 dark:bg-zinc-900">
<div th:replace="~{fragments/common :: nav('free-notes')}"></div>

<main class="mx-auto max-w-3xl px-4 py-8">

    <a th:href="${note != null ? '/free-notes/' + note.id : '/free-notes'}"
       class="mb-4 inline-flex items-center gap-1 text-sm text-slate-500 hover:text-slate-700 dark:text-zinc-400 dark:hover:text-zinc-200">
        ← 목록으로
    </a>

    <form id="noteForm"
          th:action="${note != null ? '/free-notes/' + note.id : '/free-notes'}"
          method="post">

        <input type="text" name="title" placeholder="제목을 입력하세요"
               th:value="${note?.title}"
               class="mb-4 w-full rounded-lg border border-slate-200 px-4 py-3 text-lg font-semibold text-slate-800 focus:border-indigo-400 focus:outline-none dark:bg-zinc-800 dark:border-zinc-600 dark:text-zinc-100 dark:placeholder-zinc-500">

        <!-- TinyMCE가 이 textarea를 에디터로 교체함. name="content"로 폼 전송 -->
        <textarea id="editor" name="content"
                  th:text="${note?.content}"></textarea>

        <div class="mt-4 flex items-center gap-3">
            <button type="submit"
                    class="rounded-md bg-indigo-600 px-5 py-2 text-sm font-semibold text-white hover:bg-indigo-700">
                저장
            </button>
            <a th:href="${note != null ? '/free-notes/' + note.id : '/free-notes'}"
               class="rounded-md border border-slate-300 px-5 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-50 dark:border-zinc-600 dark:text-zinc-300 dark:hover:bg-zinc-700">
                취소
            </a>
            <form th:if="${note != null}"
                  th:action="@{/free-notes/{id}/delete(id=${note.id})}"
                  method="post" class="ml-auto">
                <button type="submit"
                        onclick="return confirm('정말 삭제하시겠어요?')"
                        class="rounded-md bg-red-50 px-5 py-2 text-sm font-semibold text-red-600 hover:bg-red-100 dark:bg-red-900/30 dark:text-red-400 dark:hover:bg-red-900/50">
                    삭제
                </button>
            </form>
        </div>
    </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/tinymce@6.8.3/tinymce.min.js"></script>
<script>
var isDarkMode = document.documentElement.classList.contains('dark');

tinymce.init({
    selector: '#editor',
    base_url: 'https://cdn.jsdelivr.net/npm/tinymce@6.8.3',
    suffix: '.min',
    height: 520,
    skin: isDarkMode ? 'oxide-dark' : 'oxide',
    content_css: isDarkMode ? 'dark' : 'default',
    plugins: 'table image link lists codesample',
    toolbar: [
        'undo redo | blocks blockquote | bold italic underline strikethrough | forecolor backcolor',
        'alignleft aligncenter alignright | numlist bullist | table | image link | codesample'
    ],
    toolbar_mode: 'wrap',
    block_formats: '본문=p; 제목 1=h1; 제목 2=h2; 제목 3=h3; 인용문=blockquote',
    codesample_languages: [
        {text: 'Python', value: 'python'},
        {text: 'JavaScript', value: 'javascript'},
        {text: 'Java', value: 'java'},
        {text: 'C', value: 'c'},
        {text: 'C++', value: 'cpp'},
        {text: 'SQL', value: 'sql'},
        {text: 'HTML', value: 'markup'},
        {text: 'CSS', value: 'css'},
        {text: 'Bash', value: 'bash'},
        {text: '기타', value: 'none'}
    ],
    table_toolbar: 'tableprops tabledelete | tableinsertrowbefore tableinsertrowafter tabledeleterow | tableinsertcolbefore tableinsertcolafter tabledeletecol',
    setup: function(editor) {
        var replacements = [
            { pattern: '->', text: '→' },
            { pattern: '>', text: '▸' }
        ];
        editor.on('keydown', function(e) {
            if (e.key !== 'Tab' || e.shiftKey) return;
            var li = editor.dom.getParent(editor.selection.getNode(), 'LI');
            if (li && !li.previousElementSibling) {
                e.preventDefault();
                e.stopImmediatePropagation();
            }
        });
        editor.on('keyup', function() {
            var rng = editor.selection.getRng();
            var node = rng.startContainer;
            if (node.nodeType !== 3) return;
            var offset = rng.startOffset;
            var text = node.textContent;
            for (var i = 0; i < replacements.length; i++) {
                var p = replacements[i].pattern;
                if (offset >= p.length && text.slice(offset - p.length, offset) === p) {
                    var newText = text.slice(0, offset - p.length) + replacements[i].text + text.slice(offset);
                    node.textContent = newText;
                    var newOffset = offset - p.length + replacements[i].text.length;
                    rng.setStart(node, newOffset);
                    rng.setEnd(node, newOffset);
                    editor.selection.setRng(rng);
                    break;
                }
            }
        });
    },
    images_upload_handler: function(blobInfo) {
        return new Promise(function(resolve, reject) {
            var fd = new FormData();
            fd.append('file', blobInfo.blob(), blobInfo.filename());
            fetch('/free-notes/upload-image', {method: 'POST', body: fd})
                .then(function(r) { return r.json(); })
                .then(function(d) { resolve(d.url); })
                .catch(function() { reject('이미지 업로드 실패'); });
        });
    },
    content_style: (isDarkMode
        ? 'body { font-family: -apple-system, sans-serif; font-size: 15px; line-height: 1.7; background: #27272a; color: #e4e4e7; } blockquote { border-left: 4px solid #52525b; margin: 0.5em 0; padding: 0.5em 1em; color: #a1a1aa; } pre { background: #18181b; border: 1px solid #3f3f46; border-radius: 6px; padding: 1em 1.2em; font-size: 0.875em; overflow-x: auto; }'
        : 'body { font-family: -apple-system, sans-serif; font-size: 15px; line-height: 1.7; } blockquote { border-left: 4px solid #e2e8f0; margin: 0.5em 0; padding: 0.5em 1em; color: #64748b; } pre { background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 6px; padding: 1em 1.2em; font-size: 0.875em; overflow-x: auto; }')
        + ' ul { list-style: none; padding-left: 1.4em; margin: 0.5em 0; } ul > li { position: relative; } ul > li::before { content: "-"; position: absolute; left: -1.1em; color: inherit; } ul ul { padding-left: 1.3em; margin: 0.25em 0; } ul ul > li::before { content: "→"; left: -1.1em; } ul ul ul { padding-left: 1.3em; margin: 0.25em 0; } ul ul ul > li::before { content: "▸"; left: -1.05em; } ul ul ul ul { padding-left: 1.3em; margin: 0.25em 0; } ul ul ul ul > li::before { content: "·"; left: -1em; }'
});

document.getElementById('noteForm').addEventListener('submit', function() {
    tinymce.triggerSave();
});
</script>
</body>
</html>
