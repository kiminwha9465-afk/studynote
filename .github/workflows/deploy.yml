name: Deploy to Lightsail

on:
  push:
    branches:
      - main

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Lightsail
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            cd ~/studynote

            git fetch origin
            git reset --hard origin/main

            chmod +x gradlew
            ./gradlew build -x test

            sudo systemctl restart studynote

            sleep 30
            sudo systemctl status studynote --no-pager
            curl -s -o /dev/null -w "HTTP status: %{http_code}\n" http://localhost:8080/practical/wrong-notes || true
            sudo journalctl -u studynote -n 50 --no-pager | grep -v "at org\.\|at java\.\|at jakarta\." | tail -30