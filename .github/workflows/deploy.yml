name: Deploy to AWS Lightsail

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build JAR (skip tests)
        run: ./gradlew bootJar -x test

      - name: Copy JAR to Lightsail
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_KEY }}
          source: "build/libs/*SNAPSHOT.jar"
          target: "~/app"
          strip_components: 2

      - name: Restart service on Lightsail
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_KEY }}
          script: |
            # 기존 JAR을 새 JAR로 교체
            mv ~/app/*SNAPSHOT.jar ~/app/studynote.jar

            # systemd 서비스 재시작
            sudo systemctl restart studynote

            # 기동 확인 (최대 30초 대기)
            sleep 5
            sudo systemctl is-active --quiet studynote \
              && echo "✅ 배포 성공" \
              || (echo "❌ 서비스 기동 실패" && sudo journalctl -u studynote -n 30 && exit 1)
